<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

h2 {
    margin-bottom: 20px;
}

textarea {
    width: 400px;
    height: 300px;
    padding: 10px;
    font-size: 16px;
    border: 2px solid black;
    border-radius: 5px;
    resize: none;
    outline: none;
}

#btn {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

button {
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    background-color: #007bff;
    color: white;
}

button:hover {
    background-color: #0056b3;
}

    </style>
</head>
<body>
    <h2>Save and Load User Notes</h2>
    <textarea name="" id="notes"></textarea><br>

    <div id="btn"><button id="savebtn">Save Notes</button>
    <button id="loadbtn">Load Notes</button>
    <button id="clearbtn">Clear Notes</button></div>
    
</body>
</html>
<script >
    const textarea = document.getElementById("notes");
window.onload = function () {
    let savedNotes = localStorage.getItem("notes");

    if (savedNotes !== null) {
        textarea.value = savedNotes;
    }
};

document.getElementById("savebtn").addEventListener("click", function () {
    let notes = textarea.value.trim();

    if (notes === "") {
        alert("Please enter some notes.");
        return;
    }

    localStorage.setItem("notes", notes);
    alert("Notes saved successfully!");
});

document.getElementById("loadbtn").addEventListener("click", function () {
    let savedNotes = localStorage.getItem("notes");

    if (savedNotes !== null) {
        textarea.value = savedNotes;
    } else {
        alert("No saved notes found.");
    }
});


document.getElementById("clearbtn").addEventListener("click", function () {
    localStorage.removeItem("notes");
    textarea.value = "";
    alert("Notes cleared successfully!");
});
</script>
