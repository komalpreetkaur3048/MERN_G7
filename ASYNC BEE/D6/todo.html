<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .container{
            max-width:500px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#0d6efd;
        }

        #task{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            margin-bottom:15px;
        }

        .btn-group{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        p{
            text-align:center;
            font-weight:bold;
            color:#555;
            margin-top:15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>To-Do List</h1>

    <input type="text" id="task" placeholder="Enter a task">

    <div class="btn-group">
        <button onclick="handleclick()" class="btn btn-primary w-100">Add</button>
        <button class="btn btn-danger w-100">Remove Last Task</button>
    </div>

    <div id="list">

    </div>
</div>

</body>
</html>
<script>
    let todo=[];
    let task=document.getElementById("task");
    let list=document.getElementById("list");
    let handleclick=()=>{
        let item=task.value 
        // console.log(item);
        if(item=="") return false;
        todo.push({
            task:item,status:false
        })
        task.value = "";
        render();
    }
    let render=()=>{
        //todos
        list.innerHTML="";
        todo.forEach((el,index)=>{
            list.innerHTML += `
                <li>
                    ${el.task}
                    <button onclick="deleteTask(${index})">Delete</button>
                </li>
            `;

        })
    }
    let deleteTask = (index) => {
        todo.splice(index, 1);
        render();
    }
    
</script>
