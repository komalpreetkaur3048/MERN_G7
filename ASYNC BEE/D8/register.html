<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        .input-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            outline:none;
        }

        input:focus{
            border-color:#007bff;
        }

        button{
            width:100%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        #message{
            text-align:center;
            margin-bottom:15px;
            font-weight:bold;
        }

        .error{
            color:red;
        }

        .success{
            color:green;
        }

        p{
            text-align:center;
            margin-top:15px;
        }

        a{
            text-decoration:none;
            color:blue;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Register</h2>

    <div id="message"></div>

    <form id="registerForm">

        <div class="input-group">
            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>
        </div>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already Registered?
        <a href="login.html">Login</a>
    </p>

</div>

<!-- External JavaScript -->
<script src="localstorage.js"></script>

<script>

document.getElementById("registerForm").addEventListener("submit",function(e){

    e.preventDefault();

    let email=document.getElementById("email").value.trim();
    let password=document.getElementById("password").value;

    let message=document.getElementById("message");

    message.innerHTML="";
    message.className="";

    // Email Validation
    let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailPattern.test(email)){
        message.className="error";
        message.innerHTML="Please enter a valid email.";
        return;
    }

    // Password Validation
    if(password.length<6){
        message.className="error";
        message.innerHTML="Password must contain at least 6 characters.";
        return;
    }

    // Register User
    let result=registerUser(email,password);

    if(result==="success"){

        message.className="success";
        message.innerHTML="Registration Successful.";

        // Redirect to signup page
        setTimeout(function(){

            window.location.href="signup.html";

        },1000);

    }
    else{

        message.className="error";
        message.innerHTML="User already exists.";

    }

});

</script>

</body>
</html>
