<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 100%;
            border: 1px solid red;
            height: 500px;
        }
        img{
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Slider Page</h1>
    <div id="container">
        <img  id="movie" alt="">
    </div>
</body>
</html>
<script>
    let posters=[
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPuE7oo5g-Pz49e-AIKXQrUKZOnLrT4y1ARFk2wmaJ9w&s=10",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPuE7oo5g-Pz49e-AIKXQrUKZOnLrT4y1ARFk2wmaJ9w&s=10",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPuE7oo5g-Pz49e-AIKXQrUKZOnLrT4y1ARFk2wmaJ9w&s=10"
    ]
    let image=document.getElementById("movie")
    image.src=posters[0]
    let index=0
    setInterval(()=>{
        index++
        image.src=posters[index]
    },2000)
</script>
