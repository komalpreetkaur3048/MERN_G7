<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Collection</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h2{
            text-align: center;
            margin: 20px;
        }

        #container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 80%;
            margin: auto;
        }

        .card{
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .card img{
            width: 200px;
            height: 200px;
        }

        /* .price{
            font-size: 20px;
            color: green;
            margin-top: 10px;
        } */
    </style>
</head>
<body>

<h2>Summer Collection</h2>
<h2>🛒: <span id="count">0</span></h2>

<div id="container"></div>
<div id="container">

    

</div>

</body>
</html>
